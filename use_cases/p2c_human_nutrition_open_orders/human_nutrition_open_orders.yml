transformations:
  - id: ibm_exchange_rate
    custom_functions: 
    - name: "use_cases.custom_transformations.hn_tx.with_exchange_rate"
      kwargs:
        currency_tbl: "bronze_ingestion_dev01.saps4_ds1_r4sadditionaltables.tcurr"
        date_dim_tbl: "sandbox.ragamai.dna_date_dim"
  - id: ibm_output
    columns_expressions:
      open_pounds: >-
        case 
        when prod_unit_basis = 'K' 
        then prod_invoiced_wt * 2.2046
        else prod_invoiced_wt
        end
      open_usd: >-
        case
        when prod_unit_basis = '#' and prod_price_basis = '#' 
          then prod_price * prod_invoiced_wt * coalesce(ukurs/ffact*tfact, latest_rate, 1)
        when prod_unit_basis = '#' and prod_price_basis = 'K'
          then prod_price / 2.2046 * prod_invoiced_wt * coalesce(ukurs/ffact * tfact, latest_rate, 1)
        when prod_unit_basis = '#' and prod_price_basis = 'M'
          then  prod_price * prod_invoiced_wt / 2.2046 / 1000 * coalesce(ukurs/ffact * tfact, latest_rate, 1)
        when prod_unit_basis = '#' and prod_price_basis = 'T'
          then  prod_price  / 2000 * prod_invoiced_wt * coalesce(ukurs/ffact * tfact, latest_rate, 1)
        when prod_unit_basis = '#' and prod_price_basis = 'C'
          then  prod_price / 100 * prod_invoiced_wt * coalesce(ukurs/ffact * tfact, latest_rate, 1)
        when prod_unit_basis = '#' and prod_price_basis = 'E'
          then  prod_price * prod_invoiced_qty * coalesce(ukurs/ffact * tfact, latest_rate, 1)
        when prod_unit_basis = 'K' and prod_price_basis = '#'
          then  prod_price * 2.2046 * prod_invoiced_wt * coalesce(ukurs/ffact * tfact, latest_rate, 1)
        when prod_unit_basis = 'K' and prod_price_basis = 'K'
          then  prod_price * prod_invoiced_wt * coalesce(ukurs/ffact * tfact, latest_rate, 1)
        when prod_unit_basis = 'K' and prod_price_basis = 'M'
          then  prod_price / 1000 * prod_invoiced_wt * coalesce(ukurs/ffact * tfact, latest_rate, 1)
        when prod_unit_basis = 'K' and prod_price_basis = 'C'
          then  prod_price / 100 * prod_invoiced_wt * coalesce(ukurs/ffact * tfact, latest_rate, 1)
        when prod_unit_basis = 'K' and prod_price_basis = 'E'
          then  prod_price * prod_invoiced_qty * coalesce(ukurs/ffact * tfact, latest_rate, 1)
        else
          prod_price * prod_invoiced_wt * coalesce(ukurs/ffact * tfact, latest_rate, 1)
        end
      archive_timestamp: current_timestamp()
      source: "'IBM'"
    columns_mapping:
      inor_order_number: sales_order_number
      inor_order_date: sales_order_create_date
      sale_type: sale_type
      copc_code: company_code
      vncu_vendor_nbr: sold_to_customer_number
      vncu_name: sold_to_customer_name
      prod_inv_recno: sales_order_line
      prod_id: item_code
      prdcd: legacy_item_code
      abbr_desc: legacy_item_description
      inor_ship_date: ship_date
    columns_to_select: [source, sales_order_number, sales_order_create_date, sale_type,
      company_code, sold_to_customer_number, sold_to_customer_name, sales_order_line,
      item_code, legacy_item_code, legacy_item_description, ship_date, open_pounds,
      open_usd, archive_timestamp]
  - id: dna_date_dim_order_create
    columns_mapping:
      date_as_date: oc_date_as_date
  - id: dna_date_dim_promised_delivery
    columns_mapping:
      date_as_date: pd_date_as_date
  
  
  - id: jde_output
    columns_expressions:
      sale_type: >-
        case
          when shdcto in ('C2','C6','C7', 'S2', 'S6', 'SU') 
            then 'IDT'
          when shdcto in ('C8','CJ','CO', 'CR', 'S5', 'S8', 'SJ', 'SO') 
            then 'TRADE SALE'
          else 'UNKNOWN'
        end
      open_usd: >-
        case
          when sdfea <> 0 
            then sdfea / 100
          when sdfea = 0
            then sdaexp / 100
        end
      source: "'JDE EDU'"
      archive_timestamp: current_timestamp()
    columns_mapping:
      shdoco: sales_order_number
      oc_date_as_date: sales_order_create_date
      shkcoo: company_code
      sdan8: sold_to_customer_number
      abalph: sold_to_customer_name
      sdlnid: sales_order_line
      sditm: item_code
      sdlitm: legacy_item_code
      sddsc1: legacy_item_description
      pd_date_as_date: ship_date
      sdsoqs: open_pounds
    columns_to_select: [source, sales_order_number, sales_order_create_date, sale_type,
      company_code, sold_to_customer_number, sold_to_customer_name, sales_order_line,
      item_code, legacy_item_code, legacy_item_description, ship_date, open_pounds,
      open_usd, archive_timestamp]




combine:
  - combine_id: combine_ibmdb2
    joins:
      join_id: ibmdb2_join
      source_ids:
        - source_id: ibmdb2_inv_ord_details
          alias: iod
          join_order: 1
        - source_id: ibmdb2_opinprod_product
          alias: op
          join_type: inner
          join_order: 2
        - source_id: ibmdb2_profit_center
          alias: pc
          join_type: inner
          join_order: 3
        - source_id: ibmdb2_opininvc_invoice
          alias: oi
          join_type: left
          join_order: 4
        - source_id: ibmdb2_opencurr_currency
          alias: oc
          join_type: left
          join_order: 5
        - source_id: ibmdb2_currencytable
          alias: ct
          join_type: left
          join_order: 6
        - source_id: ibmdb2_term_code
          alias: tc
          join_type: inner
          join_order: 7
        - source_id: ibmdb2_opensale_sale_type
          alias: ost
          join_type: inner
          join_order: 8
        - source_id: ibmdb2_pdpdroot
          alias: pdpd
          join_type: inner
          join_order: 9
        - source_id: ibmdb2_apmvzlog_z_logic
          alias: azl
          join_type: inner
          join_order: 10
        - source_id: ibmdb2_apvcvncu_vendorcustomer
          alias: apvc
          join_type: inner          
          join_order: 11
      join_conditions:
        - left: iod
          right: op
          condition: iod.inor_id = op.prod_inor_id
        - left: iod
          right: pc
          condition: iod.inor_copc_id = pc.copc_id
        - left: iod
          right: oi
          condition: iod.inor_id = oi.invc_inor_id
        - left: iod
          right: oc
          condition: iod.inor_curr_id = oc.curr_id
        - left: iod
          right: ct
          condition: >-
            iod.inor_ship_date = to_date(cast(99999999 - cast(ct.gdatu as numeric) as string), "yyyyMMdd")
            and oc.curr_code = ct.fcurr
            and ct.tcurr = 'USD'
            and ct.kurst = 'M'
        - left: iod
          right: tc
          condition: iod.inor_tc_terms_code = tc.term_code
        - left: tc
          right: ost
          condition: tc.term_sale_id = ost.sale_id
        - left: op
          right: pdpd
          condition: op.prod_product_id = pdpd.product_id
        - left: iod
          right: azl
          condition: iod.inor_soldto = azl.zlog_vendor_num and azl.zlog_vendor_type = 'C'
        - left: azl
          right: apvc
          condition: azl.zlog_vendor_num_z = apvc.vncu_vendor_nbr
      select_columns:
        iod: [inor_id, inor_copc_id, inor_curr_id, inor_tc_terms_code, inor_soldto, inor_ship_date, inor_status_code,
          inor_order_number, inor_order_date]
        op: [prod_product_id, prod_inor_id, prod_inventory_sw, prod_inv_recno, 
          prod_id, prod_unit_basis, prod_invoiced_qty, prod_invoiced_wt, prod_price, prod_price_basis]
        pc: [copc_id, copc_code]
        oi: [invc_inor_id, invc_invoice_date]
        oc: [curr_id, curr_code]
        ct: [gdatu, fcurr, tcurr, kurst, tfact, ffact, ukurs]
        tc: [term_sale_id, term_code]
        ost: [sale_id, sale_type]
        pdpd: [product_id, prdcd, abbr_desc]
        azl: [zlog_vendor_num, zlog_vendor_type, zlog_vendor_num_z]
        apvc: [vncu_vendor_nbr, vncu_name]
      post_join_filters:
        - condition: >-  
              (
                (pc.copc_code in ('1010', '1034', '1035', '1201', '1202', '1203', '1206', '2058', '4208')
                and op.prod_inventory_sw = '1')
                or
                pc.copc_code = '1079'
              )
              and iod.inor_status_code in ('1', '2', '3', '5')
              and ost.sale_type in ('IDT', 'TRADE SALE')
              and oi.invc_invoice_date is null
  - combine_id: combine_jde
    joins:
      join_id: jde_join
      source_ids:
        - source_id: jdexeeu_sales_order_header
          alias: a
          join_order: 1
        - source_id: jdexeeu_sales_order_line
          alias: b
          join_type: inner
          join_order: 2
        - source_id: jdexeeu_customer_master
          alias: c
          join_type: inner
          join_order: 3
        - source_id: dna_date_dim_order_create
          alias: order_create
          join_type: inner
          join_order: 4
        - source_id: dna_date_dim_promised_delivery
          alias: promised_delivery
          join_type: inner
          join_order: 5
        
      join_conditions:
        - left: a
          right: b
          condition: a.shkcoo = b.sdkcoo and a.shdoco = b.sddoco and a.shdcto = b.sddcto
        - left: b
          right: c
          condition: b.sdan8 = c.aban8
        - left: a
          right: order_create
          condition: a.shtrdj = order_create.julian_date
        - left: a
          right: promised_delivery
          condition: b.sdrsdj = promised_delivery.julian_date
        
      select_columns:
        a: [shkcoo, shdoco, shdcto, shtrdj]
        b: [sdkcoo, sddoco, sddcto, sdan8, sdlnid, sditm, sdlitm, sddsc1, sdsoqs, sdfea, sdaexp, sdsrp4, sdcndj, sddgl, sdrsdj]
        c: [aban8, abalph]
        order_create: [julian_date, oc_date_as_date]
        promised_delivery: [julian_date, pd_date_as_date]
      post_join_filters:
        - condition: >-  
              b.sdkcoo not in ('01840', '01843', '01960',  '01961','03001', '03009', '03010', '03012', '01929')
              and b.sdsrp4 not in ('106', '157')
              and a.shdcto not in ('ST')
              and b.sdlitm not in ('Freight')
              and b.sdcndj = 0
              and b.sddgl  = 0

