combine:
  - combine_id: itemasa_combine
    joins: 
      join_id: itemasa_join
      source_ids:
        - source_id: mapics_itemasa
          alias: a
          join_order: 1
        - source_id: sapitmxref_subquery
          alias: d
          join_order: 2
          join_type : "leftouter"
        # - source_id: mapics_lblall
        #   alias: C
        #   join_order: 3
        #   join_type : "leftouter"
        # - source_id: prodprfcd_subquery
        #   alias: E
        #   join_order: 4
        #   join_type : "leftouter"
      join_conditions:
        # - left: A
        #   right: C
        #   condition: "A.ITNBR = C.LBITEM"
        - left: a
          right: d
          condition: a.ITNBR = d.ITNBR
        # - left: A
        #   right: E
        #   condition: "A.ITNBR = E.ITEM_NUM"
      select_columns: 
        a: ["ITNBR","SOURCE_SYSTEM_ID", "ITEM_PARENT_NUMBER", "LEGACY_ITEM_NUMBER", "ITEM_DESCRIPTION", "ITEM_UNIT_OF_MEASURE", "ITEM_BASE_SIZE" ]
        d: ["ITNBR"]
        # C: ["HALAL_STATUS_CODE", "KOSHER_STATUS_CODE"]
      alias: itemasa_joined

targets:
  - table_id: mapics_itemasa_table_id
    table: silver_dev01.pricing.itemasa_joined
    write_type: table
    write_mode: overwrite
    options:
      mergeSchema: "true"  # Option to merge schema
    table_properties:
      delta.feature.allowColumnDefaults: supported