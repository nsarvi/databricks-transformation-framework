sources:
  - source_id: mapics_itemasa
    table: bronze_ingestion_dev01.mapics_mapics_amflib.itemasa
    read_type: table
    transformation_id: mapics_itemasa_transformation

  - source_id: mapics_lblall
    table: bronze_ingestion_dev01.mapics_mapics_amflib.LBLALL # No LBLALL table found
    read_type: table
    transformation_id: mapics_lblall_transformation

  - source_id: sapitmxref_subquery
    subquery: |
      SELECT
        ITNBR,
        MAX(`SAP#`) AS ITEM_NUMBER
      FROM
        bronze_ingestion_dev01.mapics_mapics_crfile.sapitmxref
      GROUP BY
        ITNBR

  - source_id: prodprfcd_subquery
    subquery: |
      SELECT
        A.ITEM AS ITEM_NUM,
        A.EFDAT
      from
        bronze_ingestion_dev01.mapics_mapics_ffiles.prodprfp a
          inner join (
            select
              ITEM,
              MAX(EFDAT) as EFDAT
            from
              bronze_ingestion_dev01.mapics_mapics_ffiles.prodprfp
            where
              MSNAM = 'ITCATSUB'
            group by
              ITEM
          ) b
      on a.EFDAT = b.EFDAT


transformations:
  - id: mapics_itemasa_transformation
    column_expressions:
      - column: "*"
        expression: "*"
      - column: SOURCE_SYSTEM_ID
        expression: "'SRC001'"
      - column: ITEM_PARENT_NUMBER
        expression: "CASE 
          WHEN LENGTH(TRIM(ITNBR)) > 1 
            AND REGEXP_LIKE(SUBSTR(TRIM(ITNBR), 1, 1), '[A-Za-z]') 
            AND SUBSTR(TRIM(ITNBR), 2, 1) = '-' 
          THEN TRIM(ITNBR)
          ELSE SUBSTR(
                TRIM(ITNBR), 
                1, 
                LENGTH(TRIM(ITNBR)) - INSTR(REVERSE(TRIM(ITNBR)), '-') 
              )
         END"
      - column: LEGACY_ITEM_NUMBER
        expression: "TRIM(ITNBR)"
      - column: ITEM_DESCRIPTION
        expression: "TRIM(ITDSC)"
      - column: ITEM_UNIT_OF_MEASURE
