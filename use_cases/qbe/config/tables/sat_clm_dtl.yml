# DQ rules for dsi_dev.adv_db.sat_clm_dtl. Used by use_cases/qbe/qbe_validation.ipynb.
#
# The column files and record_columns use the catalog's column names, so the table read must have them.
# Once dsi_dev.adv_db is in this workspace, set `table` to "${source_catalog}.adv_db.sat_clm_dtl". Until then
# the stand-in Raw table below doesn't have these columns, so its rules end with threshold_status "error".
# ${source_catalog} is the notebook's `source_catalog` parameter (default in config/validation.yml).
#
# Each column's rules are in its own file, listed under `columns` (paths relative to this file).
# Optional per rule: `filter: "<SQL condition>"` (DQX's check filter) checks only the matching rows, and the
# rule's pass rate counts only those rows, e.g. filter: "CLM_STATUS <> 'CLOSED'".
table: "${source_catalog}.dbo_raw.hbm_matter"        # the table read; also its name in the results
record_columns: ["CLM_NBR", "QBE_CLM_STS_DESCR"]   # stored with each failure; omit for the full row

columns:
  - sat_clm_dtl/clm_nbr.yml
  - sat_clm_dtl/qbe_clm_sts_descr.yml

# Rules over several columns or the whole table (e.g. a unique composite key); none yet
table_rules: []
