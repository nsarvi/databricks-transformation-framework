# DQ rules for dsi_dev.adv_db.sat_clm_dtl, grouped by column. Used by use_cases/qbe/qbe_validation.ipynb.
#
# STAND-IN: dsi_dev.adv_db isn't in this workspace, so an Expert Sierra Raw table is read for testing.
# To validate the real table, set `table` to "${source_catalog}.adv_db.sat_clm_dtl" and remove the `physical_column` lines.
# ${source_catalog} is the notebook's `source_catalog` parameter (default in config/validation.yml).
#
# Optional per rule: `filter: "<SQL condition>"` (DQX's check filter) checks only the matching rows, and the
# rule's pass rate counts only those rows, e.g. filter: "CLM_STATUS <> 'CLOSED'".
table: "${source_catalog}.dbo_raw.hbm_matter"        # the table read; also its name in the results
record_columns: ["MATTER_UNO", "CLM_NBR", "QBE_CLM_STS_DESCR"]   # stored with each failure; omit for the full row

columns:
  CLM_NBR:
    physical_column: "MATTER_CODE"                    # only while the read table's column name differs
    business_term: "Claim Number"
    rules:
      - rule_id: "DQ-CLM-0001"
        rule_name: "Claim Number - Not Null or Blank"
        description: "Claim Number - Not Null or Blank"
        dq_dimension: "Completeness"
        minimum_threshold: null
        target_threshold: 100
        check:
          function: is_not_null_and_not_empty
          arguments:
            trim_strings: true

  QBE_CLM_STS_DESCR:
    physical_column: "STATUS_CODE"
    business_term: "Claim Status"
    rules:
      - rule_id: "DQ-CLM-0002"
        rule_name: "Claim Status - Not Null or Blank"
        description: "Claim Status - Not Null or Blank"
        dq_dimension: "Completeness"
        minimum_threshold: null
        target_threshold: 100
        check:
          function: is_not_null_and_not_empty
          arguments:
            trim_strings: true

      - rule_id: "DQ-CLM-0003"
        rule_name: "Claim Status - Validity"
        description: "Claim Status is in the approved list of values"
        dq_dimension: "Validity"
        minimum_threshold: null
        target_threshold: 100
        check:
          function: is_in_list                       # NULLs pass here; DQ-CLM-0002 covers them
          arguments:
            # PLACEHOLDER: the stand-in table's status codes. Replace with the approved QBE claim status values.
            # DQX reads a bare string as a column name: quote each text value inside the YAML string, e.g. "'OPEN'".
            allowed: ["'OPEN'", "'CLOSE'", "'PRECL'"]
            case_sensitive: true

# Rules over several columns or the whole table (e.g. a unique composite key); none yet
table_rules: []
