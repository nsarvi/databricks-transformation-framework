transformations:
  - id: jdexeeu_order_detail
    #columns_to_snake_case: true
    columns_to_select:
      - SDDOC
      - SDDCT
      - SDKCO
      - SDDOCO
      - SDLNID
      - SDSHAN
      - SDCO
      - SDVR01
      - SDTORG
      - SDADDJ
      - SDTRDJ
      - SDIVD
      - SDUSER
    columns_mapping:
      SDDOC: invoice_number
      SDDCT: document_type
      SDSHAN: sold_to_customer_no
      SDCO: entity_document_company_code
      SDUSER: user_id
      SDADDJ: shipment_date
      SDTRDJ: order_date
      SDIVD: invoice_date
    columns_expressions:
      entity_document_company_code: cast(entity_document_company_code as int)
    custom_functions:  
      - name: "use_cases.custom_transformations.p2c_tx.convert_julian_dates"
        kwargs:
          julian_date_cols: ["shipment_date", "order_date", "invoice_date"]


      
  - id: jdexeeu_customer_ledger
    columns_to_select:
      - RPDOC
      - RPDCT
      - RPKCO
      - RPSDOC
      - RPLNID
      - RPPTC
      - RPCRCD
      - RPBCRC
      - RPAG
      - RPACR
      - RPDDJ
    columns_mapping:
      RPPTC: payment_term_code
      RPCRCD: currency_code
      RPDDJ: invoice_due_date
    custom_functions:  
      - name: "use_cases.custom_transformations.p2c_tx.convert_julian_dates"
        kwargs:
          julian_date_cols: ["invoice_due_date"]

  - id: jdexeeu_payment_terms
    columns_to_select:
      - PNPTC
      - PNPTD
    columns_mapping:
      #PNPTC: payment_term_code
      PNPTD: payment_term_description

  - id: jdexeeu_address_book_master
    columns_to_select:
      - ABAN8
      - ABALPH
    columns_mapping:
      ABALPH: sold_to_customer_name

  - id: jdexeeu_foundation_env
    columns_mapping:
      x: x
    columns_to_select:
      - CCCO
    columns_expressions:
      CCCO: cast(CCCO as int)


  - id: jdexeeu_entity_mapping

    drop_duplicates:
      - column: "COMPANY_CODE"
    columns_to_select:
      - COMPANY_CODE
      - ENTITYNAME
      - Region
      - Division
      - COUNTRY
    columns_mapping:
      Division: segment
      ENTITYNAME: entity_document_company_name
    columns_expressions:
      COMPANY_CODE: cast(COMPANY_CODE as int)


 # need to use recevable function which uses convert_due_date function
  - id: jdexeeu_r03_accts_receivbl
    columns_mapping:
      x: x
    columns_to_select:
      - R03_SHP_DT_T
      - R03_IVC_DT_T
      - R03_LOC_CD_S
      - R03_IVC_NUM_S
      - R03_NAM_ID_S


  - id: jdexeeu_credit_dist_list
    columns_mapping:
      x: x
    columns_to_select:
      - CD_COPC
      - CD_LOCATION
      - CD_INTL_CREDIT_REP
    columns_expressions:
      CD_COPC: cast(CD_COPC as int)


  - id: jdexeeu_gbs_emea_billing_entities
    columns_mapping:
      x: x
    columns_to_select:
      - LOCATION_CODE

  - id: jdexeeu_currencytable
    custom_functions: 
    - name: "use_cases.custom_transformations.p2c_tx.currency_convert_from_source_currency_to_target_currency_fun"
      kwargs:
        target_currency_code_column: "USD"

  - id: jdexeeu_joined
    columns_expressions:
      total_invoice_amount_usd_orig: >-
        cast(CASE 
          WHEN currency_code = 'USD' and RPBCRC = 'USD' THEN round(RPAG/100,2) 
          WHEN currency_code = 'USD' and RPBCRC != 'USD' THEN round(RPACR/100,2) 
          ELSE round(RPAG/100, 2) 
        END as double)
      sold_to_customer_no: cast(sold_to_customer_no as int)
      invoice_number: cast(invoice_number as int)
      source_system: "'jdeEU'"
      __inserted_on: current_date()
      __inserted_timestamp: current_timestamp()
      gbs_group: >-
        CASE 
          WHEN CD_INTL_CREDIT_REP = 'GBS' THEN 'Y'
          ELSE 'N'
        END
      total_invoice_amount_usd: >-
        CASE 
          WHEN currency_code = 'USD' THEN cast(total_invoice_amount_usd_orig as double)
          WHEN date_converted IS NULL THEN cast(total_invoice_amount_usd_orig as double)
          ELSE cast(total_invoice_amount_usd_orig as double) * cast(exchange_rate as double)
        END
    columns_to_select:
      - shipment_date 
      - order_date
      - invoice_number
      - total_invoice_amount_usd
      - invoice_date
      - payment_term_code
      - entity_document_company_code
      - entity_document_company_name
      - user_id
      - payment_term_description
      - invoice_due_date
      - sold_to_customer_no
      - document_type
      - sold_to_customer_name
      - source_system
      - currency_code
      - region
      - segment
      - country
      - gbs_group
      - __inserted_on
      - __inserted_timestamp

    columns_mapping:
      x: x

      
      
      


combine:
  - combine_id: combine_1
    joins: 
      join_id: base_join
      source_ids:
        - source_id: jdexeeu_order_detail
          alias: od
          join_order: 1
        - source_id: jdexeeu_customer_ledger
          alias: cl
          join_order: 2
          join_type : inner
        - source_id: jdexeeu_payment_terms
          alias: pt
          join_order: 3
          join_type : left
        - source_id: jdexeeu_address_book_master
          alias: abm
          join_order: 4
          join_type : left
        - source_id: jdexeeu_foundation_env
          alias: fe
          join_order: 5
          join_type : left
        - source_id: jdexeeu_entity_mapping
          alias: em
          join_order: 6
          join_type : left
        - source_id: jdexeeu_credit_dist_list
          alias: cdl
          join_order: 7
          join_type : left
        - source_id: jdexeeu_gbs_emea_billing_entities
          alias: gebe
          join_order: 8
          join_type : left
        - source_id: jdexeeu_currencytable
          alias: ct
          join_order: 9
          join_type : left
      join_conditions:
        - left: od
          right: cl
          condition: >-
            od.invoice_number = cl.RPDOC 
            and od.document_type = cl.RPDCT 
            and od.SDKCO = cl.RPKCO 
            and od.SDDOCO = cl.RPSDOC 
            and od.SDLNID = cl.RPLNID
        - left: cl
          right: pt
          condition: cl.payment_term_code = pt.PNPTC
        - left: od
          right: abm
          condition: od.sold_to_customer_no = abm.ABAN8
        - left: od
          right: fe
          condition: od.entity_document_company_code = fe.CCCO
        - left: od
          right: em
          condition: od.entity_document_company_code = COMPANY_CODE
        - left: od
          right: cdl
          condition: od.entity_document_company_code = cdl.CD_COPC
        - left: cdl
          right: gebe
          condition: cdl.CD_LOCATION = gebe.LOCATION_CODE
        - left: od
          right: ct
          condition: od.invoice_date = ct.date_converted and cl.currency_code = ct.FCURR


      select_columns: 
        od: ["invoice_number", "document_type", "sold_to_customer_no", 
          "entity_document_company_code", "user_id", "SDKCO", "SDDOCO", 
          "SDLNID", "SDVR01", "shipment_date", "order_date", "invoice_date"]
        cl: ["RPDOC", "RPDCT", "RPKCO", "RPSDOC", "RPLNID", "RPAG", "RPACR", "RPBCRC", 
          "payment_term_code", "currency_code", "invoice_due_date"]
        pt: ["payment_term_description", "PNPTC"]
        abm: ["sold_to_customer_name", "ABAN8"]
        fe: ["CCCO"]
        em: ["COMPANY_CODE", "entity_document_company_name", "Region", "segment", "COUNTRY"]
        cdl: ["CD_COPC", "CD_LOCATION", "CD_INTL_CREDIT_REP"]
        gebe: ["LOCATION_CODE"]
        ct: ["date_converted", "FCURR", "TCURR", "exchange_rate"]

      alias: jdexeeu_joined

targets:
