# This is a Databricks asset bundle definition for wilsonelser-dtf.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: wilsonelser_dtf

include:
  # Jobs used to test the framework with a use case live next to it, in use_cases/<use case>/resources/.
  # Production pipelines and their jobs belong in the pipeline repo, not here.
  - use_cases/*/resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Bundle variables: set per target below, or at deploy time with
#   databricks bundle deploy --var="qbe_source_catalog=<catalog>"   (or BUNDLE_VAR_qbe_source_catalog)
variables:
  qbe_source_catalog:
    description: "Catalog of the tables the QBE data quality rules read (qbe_validation's `source_catalog` parameter)"
    default: "expertsierra_dev"
  qbe_results_catalog:
    description: "Catalog of the QBE results tables (qbe_validation's `results_catalog` parameter)"
    default: "nsarvi_db"
  qbe_rules_source:
    description: "Where qbe_validation reads the rules from: yaml (config/tables) or table (synced by qbe_sync_rules)"
    default: "yaml"
  qbe_clean_root:
    description: "Folder of the clean parquet datasets, one subfolder each (qbe_clean_validation's `clean_root` parameter)"
    default: "file:/Workspace/Users/sarvin_ad@wilsonelser.com/data-files"   # file:/Workspace/... or /Volumes/...
  qbe_clean_file_date:
    description: "The date folder qbe_clean_validation reads (yyyymmdd), or * for every date"
    default: "20260625"
  qbe_clean_rules_source:
    description: "Where qbe_clean_validation reads the rules from: yaml (config/clean_tables) or table (synced by qbe_clean_sync_rules)"
    default: "yaml"

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    # We use 'mode: development' to indicate this is a personal development copy:
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default
    # - The 'development' mode is used for Delta Live Tables pipelines
    mode: development
    default: true
    workspace:
      host: https://adb-7405613624754030.10.azuredatabricks.net/
    variables:
      qbe_source_catalog: "expertsierra_dev"   # stand-in Raw tables; dsi_dev once the QBE tables are in this workspace
      qbe_results_catalog: "nsarvi_db"
      qbe_rules_source: "yaml"
      
  ## Optionally, there could be a 'staging' target here.
  ## (See Databricks docs on CI/CD at https://docs.databricks.com/dev-tools/bundles/ci-cd.html.)
  #
  # staging:
  #   workspace:
  #     host: https://adb-984752964297111.11.azuredatabricks.net


