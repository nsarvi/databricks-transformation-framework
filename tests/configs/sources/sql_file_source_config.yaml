targets:
  - table_id: "source_customer_mapics"
    table: "${catalog}.${schema}.customer_mapics"
    write_type: "table"
    write_mode: "overwrite"
    partition_by: ["customer_region"]  # Clustering and partitioning cannot both be specified
    options:
      compression: "snappy"
      mergeSchema: "true"  # Option to merge schema
      overwriteSchema: "true"  # Option to overwrite schema
    schema_file: "tests/configs/schemas/bronze/customer_mapics.json"
    table_properties:
      delta.autoOptimize.optimizeWrite: "true"
      delta.autoOptimize.autoCompact: "true"

  - table_id: "source_sales_mapics"
    table: "${catalog}.${schema}.sales_mapics"
    write_type: "table"
    write_mode: "overwrite"
    partition_by: ["store_id_mapics"]  # Clustering and partitioning cannot both be specified
    options:
      compression: "snappy"
      mergeSchema: "true"  # Option to merge schema
      overwriteSchema: "true"  # Option to overwrite schema
    schema_file: "tests/configs/schemas/bronze/sales_mapics.json"
    table_properties:
      delta.autoOptimize.optimizeWrite: "true"
      delta.autoOptimize.autoCompact: "true"

