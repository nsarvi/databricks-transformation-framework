
# Transformatin will be applied on the target tables      
transformations:
  # Unique name for the transformation 
  - id: "transformation_id_1"
    # Additional columns to target table
    additional_columns:          
      - name: "region"
        type: "string"
        value: "''"
      - name: "state"
        type: "string"
        value: "'NA'"
    filters:
      - condition: "quantity > 10"
      - condition: "product_id in ('product_8', 'product_9', 'product_10')"
      - condition: "not(store_id like '%no_store_like_this%')"
