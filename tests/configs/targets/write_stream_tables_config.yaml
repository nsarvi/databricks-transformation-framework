# Configurations for the target table(s) for stream
global_config:
   base_checkpoint_location: "/Volumes/${catalog}/${schema}/checkpoints"
   query_name_prefix: "adm_stream_query"

sources:
  - source_id: "source_customer_stream_1"
    table: "${catalog}.${schema}.customer_mapics_stream_1"
    read_type: "stream"  # Options: "table" for static table, "stream" for streaming source, "cdf" for Change Data Feed

# Configurations for the target table(s) for stream
targets:
  - table_id: "target_customer_stream_1"
    table: "${catalog}.${schema}.adm_target_customer_stream_1"
    write_type: "stream"
    write_mode: "append"  # Stream write mode is typically "append", "update", or "complete"
    cluster_by: ["Customer_Number"]
    options:
      trigger: "once"  # Trigger interval for streaming (once=True or processingTime=10 seconds or continuous) 
      mergeSchema: "true"
      overwriteSchema: "true"
    table_properties:
      delta.autoOptimize.optimizeWrite: "true"
      delta.autoOptimize.autoCompact: "true"


  - table_id: "target_customer_stream_1_processing_time"
    table: "${catalog}.${schema}.adm_target_customer_stream_1"
    write_type: "stream"
    write_mode: "append"  # Stream write mode is typically "append", "update", or "complete"
    cluster_by: ["Customer_Number"]
    options:
      trigger: "processingTime=10 seconds"  # Trigger interval for streaming (once=True or processingTime=10 seconds or continuous) 
      mergeSchema: "true"
      overwriteSchema: "true"
    table_properties:
      delta.autoOptimize.optimizeWrite: "true"
      delta.autoOptimize.autoCompact: "true"

# Configurations for the target table(s) for stream - For each batch function
  - table_id: "target_customer_stream_2"
    table: "${catalog}.${schema}.adm_target_customer_stream_1"
    write_type: "stream"
    write_mode: "append"  # Stream write mode is typically "append", "update", or "complete"
    cluster_by: ["Customer_Number"]
    for_each_batch_function: "path.to.module.for_each_batch_function"
    options:
      trigger: "processingTime=10 seconds"
      mergeSchema: "true"
      overwriteSchema: "true"
    table_properties:
      delta.autoOptimize.optimizeWrite: "true"
      delta.autoOptimize.autoCompact: "true"
