# Configurations for the source table(s)
sources:
  - source_id: "source_1"
    table: "sandbox.integration_framework.customer_mapics"
    transformation_id: "transformation_id_1"
    read_type: "table"  # Options: "table" for static table, "stream" for streaming source, "cdf" for Change Data Feed

  - source_id: "source_2"
    table: "sandbox.integration_framework.sales_mapics"
    transformation_id: "transformation_id_2"
    read_type: "table"  # Options: "table" for static table, "stream" for streaming source, "cdf" for Change Data Feed

  - source_id: "source_3"
    table: "sandbox.integration_framework.store"
    read_type: "table"  # Options: "table" for static table, "stream" for streaming source, "cdf" for Change Data Feed


# Transformatin will be applied on the target tables      
transformations:
  # Unique name for the transformation 
  - id: "transformation_id_1"
    # Additional columns to target table
    additional_columns:          
      - name: "processed_date"
        type: "timestamp"
        value: "current_timestamp()"
      - name: "source_system"
        type: "string"
        value: "'MAPICS'"
    column_rename:
      - column: "customer_email_mapics"
        target_column: "customer_email"

  - id: "transformation_id_2"
    # Additional columns to target table
    additional_columns:          
      - name: "source_system"
        type: "string"
        value: "'MDM'"
    column_rename:
      - column: "customer_id_mapics"
        target_column: "customer_id"

combine:
  - combine_id: "combine_id_1"
    joins:
      join_id: "join_id_1"
      source_ids: 
        - source_id: "source_1"
          alias: "c"
          join_order: 1
        - source_id: "source_2"
          alias: "s"
          join_order: 2
          join_type: "inner"
        - source_id: "source_3"
          alias: "st_lkup"
          join_order: 3
          join_type: "inner"
      join_conditions: 
        - left: "c"
          right: "s"
          condition : "c.customer_id = s.customer_id AND c.customer_preferred_store = s.store_id_mapics"
        - left: "s"
          right: "st_lkup"
          condition: "s.store_id_mapics = st_lkup.store_id"
      select_columns:
        c: ["customer_id","customer_name", "customer_address", "customer_phone_mapics", "customer_email","customer_preferred_store","customer_since_mapics"]
        s: ["transaction_id", "product_id_mapics", "store_id_mapics", "quantity", "price"]
        st_lkup: ["store_id","store_name"]  # Include store_name from the store lookup table
      post_join_filters:
        - condition: "s.price < 50"
      alias: "customer_sales"  # Alias for the combined table


# Configurations for the target table(s)
targets:
  - table_id: "target_customer_sales"
    table: "sandbox.integration_framework.customer_sales"
    write_type: "table"
    write_mode: "overwrite"
    partition_by: ["store_id"]  # Clustering and partitioning cannot both be specified
    options:
      mergeSchema: "true"  # Option to merge schema
      overwriteSchema: "true"  # Option to overwrite schema
    schema_file: "tests/configs/schemas/silver/customer_sales.json"
    table_properties:
      delta.autoOptimize.optimizeWrite: "true"
      delta.autoOptimize.autoCompact: "true"