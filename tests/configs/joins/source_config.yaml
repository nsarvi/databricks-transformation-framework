targets:
  - table_id: "source_customer_mapics"
    table: "nsarvi.adm.customer_mapics"
    write_type: "table"
    write_mode: "overwrite"
    partition_by: ["customer_region"]  # Clustering and partitioning cannot both be specified
    options:
      mergeSchema: "true"  # Option to merge schema
      overwriteSchema: "true"  # Option to overwrite schema
    schema_file: "tests/configs/schemas/bronze/adm_customer_mapics.json"
    table_properties:
      delta.autoOptimize.optimizeWrite: "true"
      delta.autoOptimize.autoCompact: "true"

  - table_id: "source_sales_mapics"
    table: "nsarvi.adm.sales_mapics"
    write_type: "table"
    write_mode: "overwrite"
    partition_by: ["store_id_mapics"]  # Clustering and partitioning cannot both be specified
    options:
      mergeSchema: "true"  # Option to merge schema
      overwriteSchema: "true"  # Option to overwrite schema
    schema_file: "tests/configs/schemas/bronze/adm_sales_mapics.json"
    table_properties:
      delta.autoOptimize.optimizeWrite: "true"
      delta.autoOptimize.autoCompact: "true"

  - table_id: "source_store"
    table: "nsarvi.adm.store"
    write_type: "table"
    write_mode: "overwrite"
    partition_by: ["store_id"]  # Clustering and partitioning cannot both be specified
    options:
      mergeSchema: "true"  # Option to merge schema
      overwriteSchema: "true"  # Option to overwrite schema
    schema_file: "tests/configs/schemas/bronze/adm_store.json"
    table_properties:
      delta.autoOptimize.optimizeWrite: "true"
      delta.autoOptimize.autoCompact: "true"