# Target table in Silver layer. This table will have transfored columns and data
target_table:
  name: "nsarvi.adm.final_sales"
  schema_file: "schemas/adm_silver_store_config.json"

# Configurations for the source table(s)
sources:
  - table_id: "source_1"
    table: "nsarvi.adm.adm_store_1"
    # Columns to select and map the source table column(s) to target table column(s) name. This is also a column rename
    column_mapping:   
      sales_id: "sales_id"
      store_id: "store"
      product_id: "product"
      quantity: "qty"
      price: "cost"
      timestamp: "sale_time"
    # Additional columns will be added
    additional_columns:
     - name: "source_type"
       type: "string"
       value: "SAP"
     - name: "processed_date"
       type: "timestamp"
       value: "current_timestamp()"
    filters:
      - condition: "cost > 100"

  - table_id: "source_2"
    table: "nsarvi.adm.adm_store_2"
    column_mapping:
      sales_id: "transaction_id"
      store_id: "branch_id"
      product_id: "item_id"
      quantity: "count"
      price: "value"
      timestamp: "txn_time"
    additional_columns:
      - name: "region"
        type: "string"
        value: "'NA'"
      - name: "processed_date"
        type: "timestamp"
        value: "current_timestamp()"
    filters:
      - condition: "value < 1000"
      - condition: "store in (10,20)"

  - table: "nsarvi.adm.adm_store_2"
    column_mapping:
      sales_id: "transaction_id"
      store_id: "branch_id"
      product_id: "item_id"
      quantity: "count"
      price: "value"
      timestamp: "txn_time"
    additional_columns:
      - name: "region"
        type: "string"
        value: "'NA'"
      - name: "processed_date"
        type: "timestamp"
        value: "current_timestamp()"
    filters:
      - condition: "value < 1000"
      - condition: "store in (10,20)"

# Transformatin will be applied on the target tables      
transformations:
  # Unique name for the transformation 
  - id: "store_1"
    # Additional columns to target table
    additional_columns:          
      - name: "region"
        type: "string"
        value: "'NA'"
      - name: "state"
        type: "string"
        value: "'NA'"
      - name: "processed_date"
        type: "timestamp"
        value: "current_timestamp()"
      - name: "Customer_Number"
        type: "string"
        value: "'TR_ACCT_NBR'"
      - name: "Payment_ID"
        type: "string"
        value: "regexp_replace(state, ' ', '')"
      - name: "Invoice_Due_Date"
        type: "timestamp"
        value: "to_date(processed_date, 'yyyy-MM-dd')"
    filters:
      - condition: "region != 'usa'"
      - condition: "state in ('TX', 'CA', 'OH', 'NY')"

  
  # Unique name for the transformation 
  - id: "store_2"
    # Additional columns to target table
    additional_columns:          
      - name: "region"
        type: "string"
        value: "'NA'"
      - name: "processed_date"
        type: "timestamp"
        value: "current_timestamp()"
      - name: "Customer_Number"
        type: "string"
        value: "'TR_ACCT_NBR'"
      - name: "Payment_ID"
        type: "string"
        value: "regexp_replace(TR_REF_NBR, ' ', '')"
      - name: "Invoice_Due_Date"
        type: "timestamp"
        value: "to_date(TR_NET_DUE_DATE, 'yyyy-MM-dd')"
    filters:
      - condition: "Entity != '1606'"
      - condition: "TR_REC_ID in ('AC', 'AI', 'AB', 'AT')"
      - condition: "not(TR_ACT_DESC like '%TRF%')"

combine:
  unions:
  - tables: ["nsarvi.adm.store1", "nsarvi.adm.store2"]
    distinct: true  # Remove duplicates
  joins:
    - table: "nsarvi.adm.store_info"
      on: "store_id"
      type: "left"



